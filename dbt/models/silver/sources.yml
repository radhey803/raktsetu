version: 2

sources:
  - name: bronze
    schema: bronze
    description: "Raw immutable landing data ingested into DuckDB Bronze Layer without CSV roundtrip loss."
    tables:
      - name: raw_inventory
        description: "Raw nationwide blood bank inventory scraped from eRaktKosh"
        columns:
          - name: run_id
            description: "Unique scraper run execution identifier"
          - name: scraped_at
            description: "UTC timestamp when the district crawl took place"
          - name: hospital_code
            description: "Unique facility identifier code from eRaktKosh"
          - name: hospital_name
            description: "Name of the hospital or blood centre"
          - name: state_name
            description: "State or Union Territory name"
          - name: district_name
            description: "District name"
          - name: hospital_type
            description: "Govt., Private, or Charitable/Vol"
          - name: facility_type
            description: "Facility category (Blood Bank, Storage Center)"
          - name: hospital_contact
            description: "Contact phone, fax, and email strings"
          - name: hospital_address
            description: "Physical street address"
          - name: entry_date_raw
            description: "Last updated timestamp reported by facility"
          - name: components_raw
            description: "Raw JSON string containing all components and stock quantities"
          - name: raw_payload
            description: "Complete raw JSON object payload preserved for auditability"
