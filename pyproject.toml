[project]
name = "project-idea"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Radhey Gajera", email = "radheygajera@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.4",
    "async-scraper>=0.1.0",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "fastapi>=0.143.0",
    "harlequin>=2.16.1",
    "pandas>=3.0.6",
    "playwright>=1.63.0",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
project-idea = "project_idea:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
