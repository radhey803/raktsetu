blood_project:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('BLOODGRID_WAREHOUSE_PATH', 'blood_warehouse.duckdb') }}"
      threads: 4

    staging:
      type: duckdb
      path: "{{ env_var('BLOODGRID_SERVING_STAGING_PATH', 'serving.duckdb.tmp') }}"
      threads: 4

    prod:
      type: duckdb
      path: "{{ env_var('BLOODGRID_SERVING_PATH', 'serving.duckdb') }}"
      threads: 4
