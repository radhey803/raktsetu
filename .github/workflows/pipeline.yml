name: Scheduled Ingestion & Lakehouse Pipeline

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    name: Scrape, Ingest, dbt Transform & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Execute BloodLake Pipeline (Scrape -> Ingest -> dbt -> Gate -> Publish)
        run: |
          uv run bloodlake all --force
