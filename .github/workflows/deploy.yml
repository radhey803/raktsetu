name: Deploy Production Service

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'Dockerfile'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image verification
        run: |
          docker build -t bloodgrid:latest .
