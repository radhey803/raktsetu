services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bloodgrid_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./blood_warehouse.duckdb:/app/blood_warehouse.duckdb:ro
      - ./serving.duckdb:/app/serving.duckdb:ro
    restart: unless-stopped
