name: Scheduled Ingestion & Warehouse Build

on:
  schedule:
    # Runs every 4 hours: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 IST
    # IST is UTC+5:30 -> UTC schedule: 18:30, 22:30, 02:30, 06:30, 10:30, 14:30
    - cron: '30 2,6,10,14,18,22 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    name: Scrape, Transform, Gate & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Execute BloodGrid Pipeline with 2x Automatic Retry
        id: pipeline_exec
        env:
          BLOODGRID_ENV: production
          BLOODGRID_SCRAPER_CONCURRENCY: 10
          BLOODGRID_SCRAPER_TIMEOUT_SEC: 20
        run: |
          MAX_ATTEMPTS=3
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "=========================================="
            echo "🚀 Pipeline Execution Attempt $i of $MAX_ATTEMPTS"
            echo "=========================================="
            if uv run python -m bloodgrid.pipeline.run all --force; then
              echo "✅ Pipeline attempt $i succeeded!"
              exit 0
            else
              echo "⚠️ Attempt $i failed."
              if [ "$i" -lt "$MAX_ATTEMPTS" ]; then
                sleep_seconds=$((i * 30))
                echo "Sleeping $sleep_seconds seconds before retry..."
                sleep $sleep_seconds
              fi
            fi
          done
          echo "❌ All $MAX_ATTEMPTS pipeline attempts failed."
          exit 1

      - name: Dispatch Telegram Failure Alert
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.BLOODGRID_TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.BLOODGRID_TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            MESSAGE="🚨 [CRITICAL ALERT] BloodGrid Scheduled Ingestion Pipeline Failed after 3 attempts on GitHub Actions. Last verified serving data remains active."
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT_ID}" \
              -d "text=${MESSAGE}" || true
          fi

      - name: Upload Validated Serving Database to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: serving-duckdb
          path: serving.duckdb
          retention-days: 7

      - name: Upload to S3 / Cloudflare R2 Object Storage
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BLOODGRID_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BLOODGRID_S3_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.BLOODGRID_S3_ENDPOINT_URL }}
          BUCKET_NAME: ${{ secrets.BLOODGRID_S3_BUCKET_NAME }}
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$BUCKET_NAME" ]; then
            echo "Uploading serving.duckdb to object storage..."
            aws s3 cp serving.duckdb "s3://${BUCKET_NAME}/serving.duckdb" --endpoint-url "$AWS_ENDPOINT_URL" || true
            aws s3 sync data/landing/ "s3://${BUCKET_NAME}/landing/" --endpoint-url "$AWS_ENDPOINT_URL" || true
          fi

      - name: Trigger API Container Signed Refresh Webhook
        if: success()
        env:
          API_URL: ${{ secrets.BLOODGRID_API_URL }}
          WEBHOOK_SECRET: ${{ secrets.BLOODGRID_API_KEY_SECRET }}
        run: |
          if [ -n "$API_URL" ] && [ -n "$WEBHOOK_SECRET" ]; then
            echo "Triggering API zero-downtime refresh webhook..."
            curl -s -X POST "${API_URL}/v1/meta/refresh" \
              -H "Authorization: Bearer ${WEBHOOK_SECRET}" || true
          fi
