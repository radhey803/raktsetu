[project]
name = "bloodgrid"
version = "1.0.0"
description = "BloodGrid: Real-time Blood Banking Intelligence Platform & National Shortage Radar"
readme = "README.md"
authors = [
    { name = "Radhey Gajera", email = "radheygajera@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.4",
    "argon2-cffi>=23.1.0",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "email-validator>=2.0.0",
    "fastapi>=0.143.0",
    "harlequin>=2.16.1",
    "httpx>=0.27.0",
    "pandas>=3.0.6",
    "playwright>=1.63.0",
    "pyarrow>=15.0.0",
    "pydantic-settings>=2.2.0",
    "pyjwt>=2.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "requests>=2.34.2",
    "slowapi>=0.1.9",
    "typer>=0.12.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
bloodgrid = "bloodgrid.pipeline.run:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bloodgrid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "E501"]
